name: 生成书页贪吃蛇

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#F48FB1&color_dots=#F3EEF7,#F8D7E3,#F4B3CB,#E68AB0,#B9789E
            dist/snake-dark.svg?palette=github-dark&color_snake=#FFE29A&color_dots=#161B22,#3B2A45,#6B3F6E,#B05E95,#F48FB1
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
